<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply saved language direction before paint to avoid a flash.
      try {
        var l = localStorage.getItem('lang') || 'he'
        document.documentElement.lang = l
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Plan trips together — a free, shared day-by-day itinerary with map, routes, weather, budget, packing list and printable allergy cards. Plan in real time with your travel partner." />
    <link rel="canonical" href="https://trippio.app/" />
    <meta name="robots" content="index, follow" />
    <title>Trip Planner — Plan trips together: itinerary, map &amp; budget</title>

    <!-- Open Graph (link previews on WhatsApp, Facebook, Slack, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trip Planner" />
    <meta property="og:title" content="Trip Planner — Plan trips together" />
    <meta property="og:description" content="A free, shared day-by-day itinerary with map, routes, weather, budget and packing — planned in real time with your travel partner." />
    <meta property="og:url" content="https://trippio.app/" />
    <meta property="og:image" content="https://trippio.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trip Planner — Plan trips together" />
    <meta name="twitter:description" content="A free, shared day-by-day itinerary with map, routes, weather, budget and packing." />
    <meta name="twitter:image" content="https://trippio.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
